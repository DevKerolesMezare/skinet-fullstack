@if (product(); as product) {
  <mat-card appearance="raised" [routerLink]="['/shop', product.id]" class="product-card">
    <img [src]="product.pictureUrl" [alt]="'image of ' + product.name" class="rounded-t-lg"/>
    <mat-card-content class="mt-3">
      <h2 class="text-sm font-semibold uppercase">{{ product.name }}</h2>
      <P class="font-light">{{ product.price | currency }}</P>
    </mat-card-content>
    <mat-card-actions>
      <button mat-stroked-button class="w-full">
        <mat-icon>add_shopping_cart</mat-icon>
        Add to card
      </button>
    </mat-card-actions>
  </mat-card>
}
